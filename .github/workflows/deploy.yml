name: Deploy to x-server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Copy files to deploy dir
        run: |
          rsync -a --exclude 'node_modules' --exclude '.env' --exclude 'database.db' \
            kids-platform/ ~/docker/nujoom/app/
          rsync -a frontend/ ~/docker/nujoom/app/frontend/

      - name: Build Docker image
        run: |
          cd ~/docker/nujoom
          DOCKER_BUILDKIT=0 docker build --network docker_management -t nujoom:latest .

      - name: Deploy container
        run: |
          cd ~/docker
          docker compose up -d nujoom

      - name: Health check
        run: |
          sleep 5
          curl -sf http://172.18.0.90:3000/health | grep -q '"success":true'
          echo "✅ Deploy successful"
